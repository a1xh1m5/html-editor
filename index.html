<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Live HTML Editor Studio</title>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

  <!-- CodeMirror JS & Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

  <!-- CodeMirror Editing & Autocomplete Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 50px;
      background-color: #181825;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #313244;
    }

    .title {
      font-size: 1rem;
      font-weight: 600;
      color: #cba6f7;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background-color: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: #45475a;
      color: #ffffff;
    }

    .btn-primary {
      background-color: #89b4fa;
      color: #11111b;
      border: none;
    }

    .btn-primary:hover {
      background-color: #b4befe;
      color: #11111b;
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 50px);
      width: 100%;
    }

    /* Left Side: Preview & Console */
    .panel-preview {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #313244;
      background: #ffffff;
      position: relative;
    }

    .panel-header {
      background-color: #181825;
      color: #a6adc8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-bottom: 1px solid #313244;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    iframe#preview-frame {
      width: 100%;
      flex: 1;
      border: none;
      background-color: #ffffff;
    }

    /* Bottom Console Panel */
    .console-panel {
      height: 160px;
      background-color: #11111b;
      border-top: 2px solid #313244;
      display: flex;
      flex-direction: column;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .console-logs {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      color: #a6adc8;
    }

    .log-line {
      margin-bottom: 4px;
      border-bottom: 1px solid #181825;
      padding-bottom: 2px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-info { color: #89b4fa; }
    .log-warn { color: #f9e2af; }
    .log-error { color: #f38ba8; }

    /* Right Side: Code Editor */
    .panel-editor {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #282a36;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: "JetBrains Mono", "Fira Code", Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Modal Styling for Custom Libraries */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: #1e1e2e;
      border: 1px solid #45475a;
      border-radius: 8px;
      padding: 20px;
      width: 400px;
      max-width: 90%;
    }

    .modal-content h3 {
      margin-bottom: 12px;
      color: #cba6f7;
    }

    .lib-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #313244;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
      }
      .panel-preview, .panel-editor {
        width: 100%;
        height: 50%;
      }
      .panel-preview {
        border-right: none;
        border-top: 2px solid #313244;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="title">HTML Studio</div>
    <div class="actions">
      <button class="btn" onclick="openLibraryModal()">📚 Libraries</button>
      <button class="btn" onclick="downloadHTML()">💾 Download</button>
      <button class="btn btn-primary" onclick="openInNewTab()">🚀 Open in Tab</button>
    </div>
  </header>

  <div class="container">
    <!-- Left: Live Preview + Console -->
    <div class="panel-preview">
      <div class="panel-header">
        <span>Live Preview</span>
      </div>
      <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
      
      <!-- Console Area -->
      <div class="console-panel">
        <div class="panel-header">
          <span>Console Output</span>
          <button class="btn" onclick="clearConsole()" style="padding:2px 6px; font-size:0.7rem;">Clear</button>
        </div>
        <div id="console-logs" class="console-logs"></div>
      </div>
    </div>

    <!-- Right: Code Editor -->
    <div class="panel-editor">
      <div class="panel-header">
        <span>HTML Source</span>
        <span style="font-size:0.7rem; color:#6c7086;">Press Ctrl+Space for autocomplete</span>
      </div>
      <textarea id="code-input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
    </div>
  </div>

  <!-- Library Injector Modal -->
  <div id="lib-modal" class="modal">
    <div class="modal-content">
      <h3>Inject CSS/JS Libraries</h3>
      <div class="lib-option">
        <span>Tailwind CSS v3</span>
        <button class="btn" onclick="injectLibrary('tailwind')">Add</button>
      </div>
      <div class="lib-option">
        <span>Font Awesome Icons</span>
        <button class="btn" onclick="injectLibrary('fontawesome')">Add</button>
      </div>
      <div class="lib-option">
        <span>Bootstrap CSS v5</span>
        <button class="btn" onclick="injectLibrary('bootstrap')">Add</button>
      </div>
      <div class="lib-option">
        <span>jQuery v3.7</span>
        <button class="btn" onclick="injectLibrary('jquery')">Add</button>
      </div>
      <div class="lib-option">
        <span>Three.js (3D Graphics)</span>
        <button class="btn" onclick="injectLibrary('threejs')">Add</button>
      </div>
      <div style="margin-top: 15px; text-align: right;">
        <button class="btn" onclick="closeLibraryModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const starterCode = `<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f4f4f9;
      color: #333;
    }
    h1 { color: #4a90e2; }
    .card {
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Live Studio</h1>
  <div class="card">
    <p>Edit the code on the right panel to see real-time changes.</p>
  </div>

  <button onclick="console.log('Button clicked! Current time:', new Date().toLocaleTimeString())">
    Test Console Output
  </button>
</body>
</html>`;

    document.getElementById('code-input').value = starterCode;

    // Initialize CodeMirror with Autocomplete and disabled phone autocorrect options
    const editor = CodeMirror.fromTextArea(document.getElementById('code-input'), {
      mode: 'htmlmixed',
      theme: 'dracula',
      lineNumbers: true,
      autoCloseTags: true,
      autoCloseBrackets: true,
      lineWrapping: true,
      tabSize: 2,
      extraKeys: {
        "Ctrl-Space": "autocomplete"
      }
    });

    // Disable autocorrect and spellcheck directly on the CodeMirror input field element
    const inputArea = editor.getInputField();
    inputArea.setAttribute('autocorrect', 'off');
    inputArea.setAttribute('autocapitalize', 'off');
    inputArea.setAttribute('spellcheck', 'false');

    // Automatically pop up hint completions while typing HTML tags or characters
    editor.on("inputRead", function(cm, change) {
      if (change.origin !== "+input") return;
      if (change.text[0] === "<" || change.text[0] === " " || /[a-zA-Z]/.test(change.text[0])) {
        cm.showHint({ completeSingle: false });
      }
    });

    const iframe = document.getElementById('preview-frame');
    const consoleLogs = document.getElementById('console-logs');

    // Intercept console messages inside iframe and stream them into our panel UI
    function logToConsole(type, msg) {
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      line.innerText = `[${type.toUpperCase()}] ${msg}`;
      consoleLogs.appendChild(line);
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    function clearConsole() {
      consoleLogs.innerHTML = '';
    }

    // Console interceptor script tag to inject inside the render frame
    const consoleHookScript = `
      <script>
        (function() {
          function sendLog(type, args) {
            try {
              const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
              window.parent.postMessage({ type: 'CONSOLE_LOG', logType: type, message: msg }, '*');
            } catch(e) {}
          }
          const origLog = console.log;
          const origWarn = console.warn;
          const origError = console.error;
          console.log = function() { origLog.apply(console, arguments); sendLog('info', arguments); };
          console.warn = function() { origWarn.apply(console, arguments); sendLog('warn', arguments); };
          console.error = function() { origError.apply(console, arguments); sendLog('error', arguments); };
        })();
      <\/script>
    `;

    // Window message listener for cross-frame console communication
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'CONSOLE_LOG') {
        logToConsole(event.data.logType, event.data.message);
      }
    });

    // Function to render preview with iframe capability
    function updatePreview() {
      const code = editor.getValue();
      
      // Inject console hook script inside head tag
      let finalCode = code;
      if (code.includes('<head>')) {
        finalCode = code.replace('<head>', '<head>' + consoleHookScript);
      } else {
        finalCode = consoleHookScript + code;
      }

      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(finalCode);
      iframeDoc.close();
    }

    // Debounce preview updates to maintain responsive typing
    let timeout;
    editor.on('change', () => {
      clearTimeout(timeout);
      timeout = setTimeout(updatePreview, 300);
    });

    // Initial render
    updatePreview();

    // Open render output in a standalone browser tab via Blob URL
    function openInNewTab() {
      const code = editor.getValue();
      const blob = new Blob([code], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    // Download current file as index.html
    function downloadHTML() {
      const code = editor.getValue();
      const blob = new Blob([code], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // Library Modal Operations
    function openLibraryModal() {
      document.getElementById('lib-modal').style.display = 'flex';
    }

    function closeLibraryModal() {
      document.getElementById('lib-modal').style.display = 'none';
    }

    const libraries = {
      tailwind: '<script src="https://cdn.tailwindcss.com"><\/script>',
      fontawesome: '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">',
      bootstrap: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">',
      jquery: '<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>',
      threejs: '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>'
    };

    function injectLibrary(key) {
      const libTag = libraries[key];
      let code = editor.getValue();
      if (code.includes('</head>')) {
        code = code.replace('</head>', `  ${libTag}\n</head>`);
      } else {
        code = libTag + '\n' + code;
      }
      editor.setValue(code);
      closeLibraryModal();
    }
  </script>
</body>
</html>
