<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Studio</title>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

  <!-- CodeMirror JS & Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

  <!-- CodeMirror Editing & Autocomplete Addons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Smoked Dark Glass Theme */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, #1a1c23, #0f1015);
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px;
      gap: 12px;
    }

    /* Utility Class for Material Icons */
    .material-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
    }

    header {
      height: 48px;
      background: rgba(24, 26, 35, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cba6f7;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.02em;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .btn-primary {
      background: rgba(137, 180, 250, 0.15);
      color: #89b4fa;
      border: 1px solid rgba(137, 180, 250, 0.3);
    }

    .btn-primary:hover {
      background: rgba(137, 180, 250, 0.25);
      color: #b4befe;
      border-color: rgba(137, 180, 250, 0.5);
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 72px);
      width: 100%;
      gap: 12px;
    }

    /* Left Side Panel */
    .panel-preview {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(24, 26, 35, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .panel-header {
      background: rgba(18, 19, 26, 0.7);
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .iframe-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      border-radius: 8px;
      margin: 8px;
      overflow: hidden;
    }

    iframe#preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    /* Resizer Bar (Allocation Handle) */
    .resize-handle {
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: row-resize;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .resize-handle:hover, .resize-handle.active {
      background: rgba(137, 180, 250, 0.3);
    }

    .resize-handle::after {
      content: "";
      width: 32px;
      height: 2px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    /* Resizable Bottom Console Panel */
    .console-panel {
      height: 160px;
      min-height: 40px;
      max-height: 80%;
      background: rgba(12, 13, 18, 0.8);
      display: flex;
      flex-direction: column;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.8rem;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
    }

    .console-logs {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      color: #a6adc8;
    }

    .log-line {
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-info { color: #89b4fa; }
    .log-warn { color: #f9e2af; }
    .log-error { color: #f38ba8; }

    /* Right Side Panel: Code Editor */
    .panel-editor {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(24, 26, 35, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .CodeMirror {
      height: 100% !important;
      font-family: "JetBrains Mono", "Fira Code", Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.5;
      background: transparent !important;
      padding: 6px 0;
    }

    .CodeMirror-gutters {
      background: rgba(18, 19, 26, 0.5) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: rgba(24, 26, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 20px;
      width: 420px;
      max-width: 90%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      margin-bottom: 14px;
      color: #cba6f7;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lib-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
      }
      .panel-preview, .panel-editor {
        width: 100%;
        height: 50%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="title">
      <svg class="material-icon" viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
      HTML Studio
    </div>
    <div class="actions">
      <button class="btn" onclick="openLibraryModal()">
        <svg class="material-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        Libraries
      </button>
      <button class="btn" onclick="downloadHTML()">
        <svg class="material-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download
      </button>
      <button class="btn btn-primary" onclick="openInNewTab()">
        <svg class="material-icon" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        Open Tab
      </button>
    </div>
  </header>

  <div class="container">
    <!-- Left: Live Preview + Resizable Console -->
    <div class="panel-preview">
      <div class="panel-header">
        <span>Live Preview</span>
      </div>
      <div class="iframe-wrapper">
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
      </div>
      
      <!-- Console Allocation Resizer Handle -->
      <div class="resize-handle" id="resizer"></div>

      <!-- Resizable Console Area -->
      <div class="console-panel" id="console-panel">
        <div class="panel-header">
          <span>Console Output</span>
          <button class="btn" onclick="clearConsole()" style="padding:2px 8px; font-size:0.7rem;">
            <svg class="material-icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h5v2h-5zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zM14 5h-3l-1-1H6L5 5H2v2h12z"/></svg>
            Clear
          </button>
        </div>
        <div id="console-logs" class="console-logs"></div>
      </div>
    </div>

    <!-- Right: Code Editor -->
    <div class="panel-editor">
      <div class="panel-header">
        <span>HTML Source</span>
        <span style="font-size:0.7rem; color:#64748b;">Press Ctrl+Space for autocomplete</span>
      </div>
      <textarea id="code-input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
    </div>
  </div>

  <!-- Library Injector Modal -->
  <div id="lib-modal" class="modal">
    <div class="modal-content">
      <h3>
        <svg class="material-icon" viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11z"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M3 13.5h8v8H3z"/></svg>
        Inject Libraries
      </h3>
      <div class="lib-option">
        <span>Tailwind CSS v3</span>
        <button class="btn" onclick="injectLibrary('tailwind')">Add</button>
      </div>
      <div class="lib-option">
        <span>Font Awesome Icons</span>
        <button class="btn" onclick="injectLibrary('fontawesome')">Add</button>
      </div>
      <div class="lib-option">
        <span>Bootstrap CSS v5</span>
        <button class="btn" onclick="injectLibrary('bootstrap')">Add</button>
      </div>
      <div class="lib-option">
        <span>jQuery v3.7</span>
        <button class="btn" onclick="injectLibrary('jquery')">Add</button>
      </div>
      <div class="lib-option">
        <span>Three.js (3D Graphics)</span>
        <button class="btn" onclick="injectLibrary('threejs')">Add</button>
      </div>
      <div style="margin-top: 16px; text-align: right;">
        <button class="btn" onclick="closeLibraryModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const starterCode = `<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 { color: #38bdf8; }
    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Live Studio</h1>
  <div class="card">
    <p>Edit the code on the right panel to see real-time changes.</p>
  </div>

  <button onclick="console.log('Button clicked! Current time:', new Date().toLocaleTimeString())">
    Test Console Output
  </button>
</body>
</html>`;

    document.getElementById('code-input').value = starterCode;

    // CodeMirror Initialization
    const editor = CodeMirror.fromTextArea(document.getElementById('code-input'), {
      mode: 'htmlmixed',
      theme: 'dracula',
      lineNumbers: true,
      autoCloseTags: true,
      autoCloseBrackets: true,
      lineWrapping: true,
      tabSize: 2,
      extraKeys: {
        "Ctrl-Space": "autocomplete"
      }
    });

    // Disable autocorrect and spellcheck on CodeMirror input area
    const inputArea = editor.getInputField();
    inputArea.setAttribute('autocorrect', 'off');
    inputArea.setAttribute('autocapitalize', 'off');
    inputArea.setAttribute('spellcheck', 'false');

    // Auto hint suggestions
    editor.on("inputRead", function(cm, change) {
      if (change.origin !== "+input") return;
      if (change.text[0] === "<" || change.text[0] === " " || /[a-zA-Z]/.test(change.text[0])) {
        cm.showHint({ completeSingle: false });
      }
    });

    const iframe = document.getElementById('preview-frame');
    const consoleLogs = document.getElementById('console-logs');

    // Console interceptor
    function logToConsole(type, msg) {
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      line.innerText = `[${type.toUpperCase()}] ${msg}`;
      consoleLogs.appendChild(line);
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    function clearConsole() {
      consoleLogs.innerHTML = '';
    }

    const consoleHookScript = `
      <script>
        (function() {
          function sendLog(type, args) {
            try {
              const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
              window.parent.postMessage({ type: 'CONSOLE_LOG', logType: type, message: msg }, '*');
            } catch(e) {}
          }
          const origLog = console.log;
          const origWarn = console.warn;
          const origError = console.error;
          console.log = function() { origLog.apply(console, arguments); sendLog('info', arguments); };
          console.warn = function() { origWarn.apply(console, arguments); sendLog('warn', arguments); };
          console.error = function() { origError.apply(console, arguments); sendLog('error', arguments); };
        })();
      <\/script>
    `;

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'CONSOLE_LOG') {
        logToConsole(event.data.logType, event.data.message);
      }
    });

    function updatePreview() {
      const code = editor.getValue();
      let finalCode = code.includes('<head>') 
        ? code.replace('<head>', '<head>' + consoleHookScript) 
        : consoleHookScript + code;

      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(finalCode);
      iframeDoc.close();
    }

    let timeout;
    editor.on('change', () => {
      clearTimeout(timeout);
      timeout = setTimeout(updatePreview, 300);
    });

    updatePreview();

    // Console Allocation / Resizing Drag Script
    const resizer = document.getElementById('resizer');
    const consolePanel = document.getElementById('console-panel');
    let isResizing = false;
    let startY, startHeight;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      startY = e.clientY;
      startHeight = consolePanel.offsetHeight;
      resizer.classList.add('active');
      document.body.style.cursor = 'row-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const dy = startY - e.clientY;
      const newHeight = startHeight + dy;
      if (newHeight >= 35 && newHeight <= window.innerHeight * 0.75) {
        consolePanel.style.height = `${newHeight}px`;
      }
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    function openInNewTab() {
      const code = editor.getValue();
      const blob = new Blob([code], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }

    function downloadHTML() {
      const code = editor.getValue();
      const blob = new Blob([code], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function openLibraryModal() {
      document.getElementById('lib-modal').style.display = 'flex';
    }

    function closeLibraryModal() {
      document.getElementById('lib-modal').style.display = 'none';
    }

    const libraries = {
      tailwind: '<script src="https://cdn.tailwindcss.com"><\/script>',
      fontawesome: '<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">',
      bootstrap: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">',
      jquery: '<script src="https://code.jquery.com/jquery-3.7.1.min.js"><\/script>',
      threejs: '<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>'
    };

    function injectLibrary(key) {
      const libTag = libraries[key];
      let code = editor.getValue();
      if (code.includes('</head>')) {
        code = code.replace('</head>', `  ${libTag}\n</head>`);
      } else {
        code = libTag + '\n' + code;
      }
      editor.setValue(code);
      closeLibraryModal();
    }
  </script>
</body>
</html>
